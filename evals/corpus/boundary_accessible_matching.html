<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Přístupné přiřazování zlomků</title>
</head>
<body>
  <main>
    <h1>Přiřaď zlomek ke grafickému znázornění</h1>
    <p id="instructions">Vyberte zlomek a následně odpovídající obrázek pomocí mezerníku nebo klávesy Enter.</p>
    <div class="fraction-list" role="region" aria-label="Zlomky">
      <button type="button" tabindex="0" aria-pressed="false">1/2</button>
      <button type="button" tabindex="0" aria-pressed="false">3/4</button>
    </div>
    <div class="visual-list" role="region" aria-label="Grafická znázornění">
      <button type="button" tabindex="0" aria-pressed="false">Půlkruh</button>
      <button type="button" tabindex="0" aria-pressed="false">Tři čtvrtiny kruhu</button>
    </div>
  </main>
</body>
</html>
